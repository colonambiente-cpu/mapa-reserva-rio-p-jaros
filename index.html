<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Reserva Río de los Pájaros</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. CENTRAR MAPA EN LA RESERVA
        const map = L.map('map').setView([-32.208915862021136, -58.14398288726807], 15);

        // 2. CAPA DE MAPA BASE (OpenStreetMap)
        const mapaNormal = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. AGREGAR PIN DE ENTRADA PRINCIPAL
        L.marker([-32.208915862021136, -58.14398288726807])
            .addTo(map)
            .bindPopup('<b>Entrada Principal</b><br>Acceso a la Reserva Natural.');
    </script>

</body>
</html>
