<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reserva Río de los Pájaros</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
}

#map{
width:100%;
height:100vh;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var mapa=L.map('map').setView([-32.22,-58.15],14);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(mapa);

L.marker([-32.22,-58.15])
.addTo(mapa)
.bindPopup("Reserva Río de los Pájaros");

</script>

</body>
</html>
